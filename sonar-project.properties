# SonarQube Cloud 設定
# organization/projectKey 到 sonarcloud.io 匯入專案後，在專案設定頁可以看到實際值，
# 通常是 organization=你的 GitHub 帳號、projectKey=帳號_repo名稱，先用這個猜測值，
# 如果 sonarcloud.io 顯示的不一樣，改成它顯示的值就好
sonar.organization=toyotad820
sonar.projectKey=toyotad820_special-fund-approval

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,src/lib/stamp-font.ts

sonar.sourceEncoding=UTF-8
